# Tollgate policy. Hot reloaded. Track A owns everything except `content:` (Track B).
# Full schema sketch: TOLLGATE.md section 4.6. Grows as acceptance tests land.
mode: balanced

servers:
  github:  { mock: mocks.github }
  tickets: { mock: mocks.tickets }
  files:   { mock: mocks.files }

roles:
  role-1:
    servers:
      github: { access: read }
    models: [qwen3:1.7b]                     # AC12 demo: qwen3:4b is denied here
    budget: { tokens_per_day: 20000 }        # small, so AC11's 429 is demoable
  role-2:
    servers:
      github:  { access: rw }
      tickets: { access: rw }
      files:   { tools: [fs.list, fs.read, fs.write] }   # exact pick, no fs.delete
    constrain:
      files.fs.read: { path: "/workspace/**" }
      tickets.query: { sql: select_only }
    # Demo: redact secrets instead of blocking, so step 2 of `tollgate replay github` succeeds
    # (AKIA key masked) and taint, not content, is shown stopping the leak. Overrides `content:` keys for this role.
    content: { secrets: redact }
    models: [qwen3:4b]
    budget: { tokens_per_day: 500000 }

labels:
  github.issues.read: [untrusted_source]
  github.repo.read:   [private_data]
  github.pr.create:   [public_sink]

taint:
  enabled: true
  block_flow: { from: private_data, to: public_sink, action: block }

loops: { max_identical_calls: 5 }   # same key + tool + args more than N times in a row -> loop.cutoff

content:
  pii:       { iban: redact, pesel: block, card: redact, email: redact }
  secrets:   block
  injection: { low: 0.50, high: 0.50, sync_max_tokens: 64, sync_points: [prompt], tier1_action: allow }  # strict: block. sync_points: always sync at any length (the model door pays seconds anyway). high swept on the 70% split (audit/eval.json): strict 0.50 (FPR<=10%), lenient 0.50 (FPR<=2%); below low is not allowed
  signatures: signatures.yaml
