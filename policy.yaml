# Tollgate policy. Hot reloaded. Track A owns everything except `content:` (Track B).
# Full schema sketch: TOLLGATE.md section 4.6. Grows as acceptance tests land.
mode: balanced

servers:
  github:  { mock: mocks.github }
  tickets: { mock: mocks.tickets }
  files:   { mock: mocks.files }
  # Real upstreams (docs/connectivity.md), next to the mocks. Commented out so the demo stays offline;
  # the name must not clash with a mock, and roles.<role>.servers must grant it like any other server.
  # gh:    { url: "https://api.githubcopilot.com/mcp/", headers: { Authorization: "Bearer ${GITHUB_TOKEN}" } }
  # fs:    { command: bunx, args: ["@modelcontextprotocol/server-filesystem", "/workspace"] }
  # local: { command: uv, args: [run, my_server.py], env: { API_KEY: "${MY_API_KEY}" }, cwd: ../my-server }

roles:
  role-1:
    servers:
      github: { access: read }
    models: [qwen3:1.7b]                     # AC12 demo: qwen3:4b is denied here
    budget: { tokens_per_day: 20000 }        # small, so AC11's 429 is demoable
  role-2:
    servers:
      github:  { access: rw }
      tickets: { access: rw }
      files:   { tools: [fs.list, fs.read, fs.write] }   # exact pick, no fs.delete
    constrain:
      files.fs.read: { path: "/workspace/**" }
      tickets.query: { sql: select_only }
    # Demo: redact secrets instead of blocking, so step 2 of `tollgate replay github` succeeds
    # (AKIA key masked) and taint, not content, is shown stopping the leak. Overrides `content:` keys for this role.
    content: { secrets: redact }
    models: [qwen3:4b]
    budget: { tokens_per_day: 500000 }

labels:
  github.issues.read: [untrusted_source]
  github.repo.read:   [private_data]
  github.pr.create:   [public_sink]
  tickets.read:       [untrusted_source]   # Supabase trace: ticket bodies are customer-written
  tickets.query:      [private_data]       # can read customers (PII); role-2's select_only still allows it
  tickets.reply:      [public_sink]        # replies are visible to the ticket's author

builtins:                                      # agent-native tools seen through POST /hook (Claude Code names; `tollgate hook` maps others)
  Read:      [private_data]                    # files on the laptop: company code and data
  Grep:      [private_data]
  Glob:      []
  Edit:      []
  Write:     []
  WebFetch:  [untrusted_source]                # anyone can write a web page
  WebSearch: [untrusted_source]
  Bash:                                        # labels by command pattern (fnmatch, case-insensitive, per part of a compound command; first match wins), else `default`
    public_sink:      ["git push*", "gh pr create*", "gh issue comment*", "curl * -d *", "curl *--data*", "curl * -F *", "scp *", "wget --post*"]
    untrusted_source: ["curl *", "wget *", "gh issue view*", "gh pr view*"]
    default:          []

taint:
  enabled: true
  block_flow: { from: private_data, to: public_sink, action: block }

approval: { timeout_s: 30 }       # an `approve` verdict (roles.<role>.approval or block_flow.action: approve) waits this long for POST /admin/approvals/{id}, then fails closed
loops: { max_identical_calls: 5 }   # same key + tool + args more than N times in a row -> loop.cutoff
# feed: { url: http://127.0.0.1:8090/bundle.json, interval_s: 10 }   # P6: pull signed signatures from `tollgate feed serve` into content.signatures; off = local file is authoritative

content:
  pii:       { iban: redact, pesel: block, card: redact, email: redact }
  secrets:   block
  injection: { low: 0.50, high: 0.50, sync_max_tokens: 64, sync_points: [prompt], tier1_action: allow, tool_result_action: flag, sample_chunks: 0 }  # strict: block. sync_points: always sync at any length (the model door pays seconds anyway). high swept on the 70% split (audit/eval.json): strict 0.50 (FPR<=10%), lenient 0.50 (FPR<=2%); below low is not allowed. tool_result_action: flag = a t2 hit on a tool result is recorded, taint stops the flow (strict: block). sample_chunks: 0 skips tier 2 on long tool results (flag-only here, and +1-3 s per call); strict samples 3
  signatures: signatures.yaml
  max_scan_chars: 100000  # longer inputs: tier 1 scans every chunk of this size (content.chunked); over 2 MB: block (content.too_large)
