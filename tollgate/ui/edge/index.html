<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tollgate Edge</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Views">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Tollgate</span></div>
    <a href="#sessions" data-view="sessions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Sessions</span></a>
    <a href="#analytics" data-view="analytics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg><span>Analytics</span></a>
    <a href="#setup" data-view="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M15 7l5 5-5 5"/></svg><span>Setup</span></a>
    <a href="#scenario" data-view="scenario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>Scenario</span></a>
    <div class="nav-foot">Local edge</div>
  </nav>
  <div class="main">
    <header class="top">
      <button id="health" class="health" type="button" aria-live="polite"><span class="dot"></span><span class="msg">Checking…</span></button>
      <div id="status" class="status" aria-label="Status"></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
