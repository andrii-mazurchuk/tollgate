[project]
name = "agent-tollgate"
version = "1.0.0"
description = "AI control layer: per-role virtual MCPs, session taint, local content inspection"
readme = "README.md"
license = "MIT"
authors = [{ name = "Andrii Mazurchuk" }]
requires-python = ">=3.13"
dependencies = [
    "fastmcp==4.0.10",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6",
    "tokenizers>=0.23.2",
]

[project.urls]
Homepage = "https://github.com/andrii-mazurchuk/tollgate"
Repository = "https://github.com/andrii-mazurchuk/tollgate"

[project.scripts]
tollgate = "tollgate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tollgate"]

[tool.hatch.build.targets.wheel.force-include]  # defaults for installed mode (tollgate/paths.py, `tollgate init`)
"policy.yaml" = "tollgate/_defaults/policy.yaml"
"signatures.yaml" = "tollgate/_defaults/signatures.yaml"
"policies" = "tollgate/_defaults/policies"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: demo-path checks run by scripts/smoke.sh before every merge to main",
    "track_a: owned by Track A (Gateway)",
    "track_b: owned by Track B (Content and evidence)",
    "redteam: Track A/B red-team bypass attempts that must stay blocked",
    "slow: loads the real tier 2 model, runs the full eval, starts real servers or asserts wall-clock timings; skip with -m 'not slow'",
]
