<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#1a1d24">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f6f7f9; stroke: #9aa0a8; stroke-width: 1.5; }
    .edge { fill: #eef3fb; stroke: #2f5fa7; stroke-width: 2.5; }
    .hub { fill: #fdf0e9; stroke: #d9480f; stroke-width: 2.5; }
    .t { font-weight: 700; font-size: 20px; }
    .s { font-size: 15px; fill: #555; }
    .ln { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#a); }
    .dash { stroke-dasharray: 6 5; }
  </style>

  <!-- main path -->
  <rect class="box" x="0" y="95" width="140" height="100" rx="8"/>
  <text class="t" x="70" y="138" text-anchor="middle">Agent</text>
  <text class="s" x="70" y="162" text-anchor="middle">MCP client + hooks</text>

  <rect class="edge" x="190" y="40" width="250" height="210" rx="8"/>
  <text class="t" x="315" y="74" text-anchor="middle" fill="#2f5fa7">Edge</text>
  <text class="s" x="315" y="96" text-anchor="middle">content checks, every call + result</text>
  <text x="315" y="140" text-anchor="middle">1. normalise</text>
  <text x="315" y="175" text-anchor="middle">2. regex + checksums</text>
  <text x="315" y="210" text-anchor="middle">3. DeBERTa (tier 2)</text>

  <rect class="hub" x="490" y="20" width="300" height="250" rx="8"/>
  <text class="t" x="640" y="54" text-anchor="middle" fill="#d9480f">Hub</text>
  <text class="s" x="640" y="76" text-anchor="middle">one virtual MCP per role</text>
  <text x="640" y="114" text-anchor="middle">key -&gt; role MCP</text>
  <text x="640" y="146" text-anchor="middle">argument limits</text>
  <text x="640" y="178" text-anchor="middle">session taint</text>
  <text x="640" y="210" text-anchor="middle">budget / loop cut-off</text>
  <text x="640" y="242" text-anchor="middle">approval (API/CLI)</text>

  <rect class="box" x="840" y="70" width="195" height="150" rx="8"/>
  <text class="t" x="937" y="104" text-anchor="middle">Source MCPs</text>
  <text x="937" y="140" text-anchor="middle">github</text>
  <text x="937" y="168" text-anchor="middle">tickets</text>
  <text x="937" y="196" text-anchor="middle">files</text>

  <path class="ln" d="M140,145 H186"/>
  <path class="ln" d="M440,145 H486"/>
  <path class="ln" d="M790,145 H836"/>

  <!-- model door -->
  <path class="ln" d="M70,195 V306"/>
  <rect class="box" x="0" y="310" width="140" height="64" rx="8"/>
  <text class="t" x="70" y="337" text-anchor="middle">Model door</text>
  <text class="s" x="70" y="359" text-anchor="middle">allow-list, budget</text>
  <path class="ln" d="M70,374 V406"/>
  <rect class="box" x="0" y="410" width="140" height="54" rx="8"/>
  <text class="t" x="70" y="443" text-anchor="middle">Ollama</text>

  <!-- control inputs -->
  <rect class="box" x="190" y="340" width="190" height="64" rx="8"/>
  <text class="t" x="285" y="367" text-anchor="middle">Signature feed</text>
  <text class="s" x="285" y="389" text-anchor="middle">HMAC-signed</text>
  <path class="ln" d="M285,340 V254"/>

  <rect class="box" x="420" y="340" width="190" height="64" rx="8"/>
  <text class="t" x="515" y="367" text-anchor="middle">policy.yaml</text>
  <text class="s" x="515" y="389" text-anchor="middle">hot reload</text>
  <path class="ln dash" d="M480,340 L425,254"/>
  <path class="ln dash" d="M550,340 L570,274"/>

  <!-- audit -->
  <rect class="box" x="660" y="340" width="170" height="64" rx="8"/>
  <text class="t" x="745" y="367" text-anchor="middle">audit JSONL</text>
  <text class="s" x="745" y="389" text-anchor="middle">every decision</text>
  <path class="ln" d="M745,270 V336"/>
  <path class="ln" d="M830,372 H876"/>
  <rect class="box" x="880" y="340" width="155" height="64" rx="8"/>
  <text class="t" x="957" y="378" text-anchor="middle">/console + /edge</text>
</svg>
