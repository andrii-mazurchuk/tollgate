# Tollgate policy profile: LENIENT (internal pilots, trusted users, low friction).
# Use: copy over policy.yaml (`cp policies/lenient.yaml policy.yaml`); the gateway hot reloads it on the next call.
# Posture: only confident injection scores block, most PII is masked rather than blocked, private -> public flows
# go to human approval. Role scoping and taint still apply: they are the controls that stop the incidents.

mode: lenient                                  # profile name; a label for the dashboard and audit, not read as a switch

servers:                                       # source MCP servers the gateway proxies (tool names become <server>.<tool>)
  github:  { mock: mocks.github }              # in-process mock GitHub: issues.read, repo.read, pr.create
  tickets: { mock: mocks.tickets }             # in-process mock helpdesk (SQLite): read, reply, query
  files:   { mock: mocks.files }               # in-process mock filesystem: fs.list, fs.read, fs.write, fs.delete

roles:                                         # one virtual MCP per role at /mcp/<role>/, reachable only with that role's key
  role-1:                                      # read-only analyst
    servers:                                   # which sources this role sees
      github: { access: read }                 # read = only tools the source marks readOnlyHint
    models: [qwen3:1.7b, qwen3:4b]             # both local models allowed
    budget: { tokens_per_day: 100000 }         # 5x balanced
  role-2:                                      # engineer / support agent
    servers:                                   # which sources this role sees
      github:  { access: rw }                  # rw = every tool on the source
      tickets: { access: rw }                  # rw = read, reply, query
      files:   { tools: [fs.list, fs.read, fs.write] }   # exact tool pick: still no fs.delete
    constrain:                                 # per-tool argument limits
      files.fs.read: { path: "/workspace/**" } # reads stay in the workspace
      tickets.query: { sql: select_only }      # a single SELECT only (a DELETE is never "lenient")
    content: { secrets: redact }               # per-role override: mask secrets instead of blocking
    models: [qwen3:4b]                         # model door allow-list
    budget: { tokens_per_day: 2000000 }        # 4x balanced

labels:                                        # taint labels per tool
  github.issues.read: [untrusted_source]       # public issues: anyone can write them
  github.repo.read:   [private_data]           # private repos
  github.pr.create:   [public_sink]            # PRs on public repos are world-readable
  tickets.read:       [untrusted_source]       # ticket bodies are customer-written
  tickets.query:      [private_data]           # can read the customers table (PII)
  tickets.reply:      [public_sink]            # replies are visible to the ticket's author

taint:                                         # session taint; a session = one issued role key
  enabled: true                                # still on: it costs ~0.005 ms per call (audit/perf.json)
  block_flow: { from: private_data, to: public_sink, action: approve }   # intent: a human approves; approval is not built yet, so approve acts as block (the message says so)

loops: { max_identical_calls: 10 }             # tolerate retries and polling agents

content:                                       # content pipeline (Track B semantics)
  pii:                                         # mask rather than block
    iban: redact                               # IBAN -> [IBAN:…1234]
    pesel: redact                              # PESEL -> [PESEL] (balanced blocks)
    nip: allow                                 # NIP: company tax ids are public in PL
    card: redact                               # card numbers stay masked even here (PCI DSS)
    email: allow                               # emails pass (internal use)
  secrets: block                               # global default; role-2 overrides to redact above
  injection:                                   # tier 1 heuristics + tier 2 classifier
    low: 0.70                                  # t2.suspect flag band starts here
    high: 0.90                                 # only confident tier 2 scores block
    sync_max_tokens: 64                        # short texts scored synchronously; longer tool results deferred
    sync_points: [prompt]                      # prompts at the model door always scored synchronously
    tier1_action: allow                        # tier 1 phrases are flags that escalate to tier 2, never block alone
    md_exfil: block                            # markdown image exfiltration still blocks: a data leak, not a judgement call
    tool_result_action: flag                   # intent: flag only, rely on taint. NOT read by scan() yet (tier 2 >= high still blocks there)
  signatures: signatures.yaml                  # hot-reloaded signature feed
