# Tollgate policy profile: STRICT (regulated data, untrusted agents, "deny by default").
# Use: copy over policy.yaml (`cp policies/strict.yaml policy.yaml`); the gateway hot reloads it on the next call.
# Posture: block on any injection signal, block every validated PII type and every secret, tight budgets and loops.
# Expect more false positives than balanced (tier 1 phrases block alone, all tool results scored); that is the price.

mode: strict                                   # profile name; a label for the dashboard and audit, not read as a switch
# allow_unenrolled_keys: true   # lets hand-issued keys (tollgate key issue, no peer) in; default false: only keys
#                               # minted per agent launch (tollgate connect) on an enrolled laptop pass the doors

servers:                                       # source MCP servers the gateway proxies (tool names become <server>.<tool>)
  github:  { mock: mocks.github }              # in-process mock GitHub: issues.read, repo.read, pr.create
  tickets: { mock: mocks.tickets }             # in-process mock helpdesk (SQLite): read, reply, query
  files:   { mock: mocks.files }               # in-process mock filesystem: fs.list, fs.read, fs.write, fs.delete

roles:                                         # one virtual MCP per role at /mcp/<role>/, reachable only with that role's key
  role-1:                                      # read-only analyst
    servers:                                   # which sources this role sees
      github: { access: read }                 # read = only tools the source marks readOnlyHint
    models: [qwen3:1.7b]                       # model door allow-list; any other model -> 403
    budget: { tokens_per_day: 10000 }          # half of balanced
    builtins: { deny: [WebFetch, WebSearch] }  # the analyst agent may not browse the web through its own tools
  role-2:                                      # engineer / support agent
    servers:                                   # which sources this role sees
      github:  { access: rw }                  # rw = every tool on the source
      tickets: { access: rw }                  # rw = read, reply, query
      files:   { tools: [fs.list, fs.read, fs.write] }   # exact tool pick: no fs.delete
    constrain:                                 # per-tool argument limits
      files.fs.read:  { path: "/workspace/**" }          # reads stay in the workspace
      files.fs.write: { path: "/workspace/out/**" }      # writes only into an output folder
      tickets.query:  { sql: select_only }               # a single SELECT only
    # no per-role content override: secrets block for everyone (step 2 of `tollgate replay github` blocks on content)
    models: [qwen3:4b]                         # model door allow-list
    budget: { tokens_per_day: 200000 }         # tighter than balanced (500000)

labels:                                        # taint labels per tool
  github.issues.read: [untrusted_source]       # public issues: anyone can write them
  github.repo.read:   [private_data]           # private repos
  github.pr.create:   [public_sink]            # PRs on public repos are world-readable
  tickets.read:       [untrusted_source]       # ticket bodies are customer-written
  tickets.query:      [private_data]           # can read the customers table (PII)
  tickets.reply:      [public_sink]            # replies are visible to the ticket's author

builtins:                                      # agent-native tools seen through POST /hook (Claude Code names; `tollgate hook` maps others)
  Read:      [private_data]                    # files on the laptop: company code and data
  Grep:      [private_data]
  Glob:      []
  Edit:      []
  Write:     []
  WebFetch:  [untrusted_source]                # anyone can write a web page
  WebSearch: [untrusted_source]
  Bash:                                        # labels by command pattern (fnmatch, case-insensitive, per part of a compound command; first match wins), else `default`
    public_sink:      ["git push*", "gh pr create*", "gh issue comment*", "curl * -d *", "curl *--data*", "curl * -F *", "scp *", "wget --post*"]
    untrusted_source: ["curl *", "wget *", "gh issue view*", "gh pr view*"]
    default:          []

taint:                                         # session taint; a session = one issued role key
  enabled: true                                # always on
  block_flow: { from: private_data, to: public_sink, action: block }   # tainted + private -> public sink: hard block

approval: { timeout_s: 30 }                    # `approve` verdicts wait this long for an admin decision, then fail closed
loops: { max_identical_calls: 3 }              # cut runaway agents early (balanced: 5)
# feed: { url: http://127.0.0.1:8090/bundle.json, interval_s: 10 }   # P6 external signature feed: pulled, HMAC-verified, written to content.signatures; `tollgate up` starts the feed server

content:                                       # content pipeline (Track B semantics)
  pii:                                         # every validated PII type blocks the call
    iban: block                                # IBAN -> block (query results with IBANs are refused, not masked)
    pesel: block                               # PESEL -> block
    nip: block                                 # NIP -> block
    card: block                                # card number -> block
    email: block                               # email -> block
  secrets: block                               # any secret -> block
  injection:                                   # tier 1 heuristics + tier 2 classifier
    low: 0.30                                  # wide suspect band: more t2.suspect flags in the audit
    high: 0.50                                 # block at >= 0.50 (FPR <= 10% on the tuning split)
    sync_max_tokens: 256                       # score up to one full chunk synchronously (~0.5 s on the demo laptop)
    sync_points: [prompt, tool_result]         # prompts and tool results always scored synchronously, any length
    tier1_action: block                        # a tier 1 injection phrase alone blocks
    md_exfil: block                            # markdown image exfiltration -> block
    tool_result_action: block                  # intent: injection in a tool result blocks.
  signatures: signatures.yaml                  # hot-reloaded signature feed
